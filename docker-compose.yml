services:
  traceip:
    build:
      context: .
      dockerfile: Dockerfile
    image: traceip:latest
    container_name: traceip-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - STATIC_DIR=/app/dist
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M
